name: Build Graphite Base 24 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'GraphiteSearchWidget_PHONE_v2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unpack Base 24 source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q GraphiteSearchWidget_PHONE_v2.zip -d work

      - name: Validate mappings and resources
        run: |
          cd work/GraphiteSearchWidget_PHONE_v2
          gradle :app:validateIconPack --stacktrace

      - name: Build debug APK
        run: |
          cd work/GraphiteSearchWidget_PHONE_v2
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphite-Base24-debug
          path: work/GraphiteSearchWidget_PHONE_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
