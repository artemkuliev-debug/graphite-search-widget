name: Build Graphite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: |
          mkdir work
          unzip -q GraphiteSearchWidget_PHONE_v2.zip -d work

      - name: Build APK
        run: |
          cd work/GraphiteSearchWidget_PHONE_v2
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GraphiteSearch-debug
          path: work/GraphiteSearchWidget_PHONE_v2/app/build/outputs/apk/debug/app-debug.apk
