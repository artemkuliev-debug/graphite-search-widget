name: Build Graphite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Unpack project
        run: |
          mkdir work
          unzip -q GraphiteSearchWidget_PHONE_v2.zip -d work

      - name: Fix JVM 17
        run: |
          cat > work/GraphiteSearchWidget_PHONE_v2/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.graphite.searchwidget"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.graphite.searchwidget"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1-test"
              }

              compileOptions {
                  sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17
                  targetCompatibility = org.gradle.api.JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Build APK
        run: |
          cd work/GraphiteSearchWidget_PHONE_v2
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GraphiteSearch-debug
          path: work/GraphiteSearchWidget_PHONE_v2/app/build/outputs/apk/debug/app-debug.apk
        
